<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Una carta para Marisela</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #283026 0%, #111612 45%, #050706 100%);
      color: #F2E6C8;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 20px 20px 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .title {
      margin: 12px 0 4px;
      text-align: center;
      font-size: 28px;
      font-weight: normal;
      letter-spacing: 1px;
      color: #F1DFB5;
      text-shadow: 0 2px 8px #000;
    }

    .subtitle {
      margin: 0 0 10px;
      text-align: center;
      font-size: 14px;
      color: #C8B990;
      letter-spacing: 1px;
    }

    /* HEDWIG */
    .owl-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }

    .owl-video {
      display: block;
      width: min(100%, 420px);
      max-height: 38vh;
      object-fit: contain;
      background: transparent;
    }

    /* VOLUME */
    .sound-message {
      margin-top: 8px;
      margin-bottom: 12px;
      text-align: center;
      font-size: 15px;
      color: #DDCCA4;
    }

    .volume-button {
      border: 1px solid rgba(226, 201, 145, 0.55);
      background: rgba(0, 0, 0, 0.35);
      color: #F5E6BF;
      border-radius: 999px;
      padding: 10px 18px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.35);
    }

    .volume-button:active {
      transform: scale(.97);
    }

    /* ENVELOPE */
    .envelope-button {
      width: 100%;
      max-width: 390px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      position: relative;
      animation: floatEnvelope 3s ease-in-out infinite;
    }

    .envelope-button img {
      display: block;
      width: 100%;
      height: auto;
      filter: drop-shadow(0 13px 16px rgba(0,0,0,.55));
    }

    @keyframes floatEnvelope {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-7px);
      }
    }

    .open-text {
      margin-top: 19px;
      text-align: center;
      color: #EADBB5;
      font-size: 17px;
      line-height: 1.5;
      letter-spacing: .4px;
    }

    .open-text span {
      display: block;
      margin-top: 4px;
      color: #BBA87C;
      font-size: 13px;
    }

    /* MODAL */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0, 0, 0, .88);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .modal.show {
      display: flex;
      animation: fadeIn .35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .letter-wrapper {
      position: relative;
      width: 100%;
      max-width: 650px;
      max-height: 94vh;
      display: flex;
      justify-content: center;
      animation: revealLetter .55s cubic-bezier(.2,.8,.2,1);
    }

    @keyframes revealLetter {
      from {
        opacity: 0;
        transform: scale(.82) translateY(25px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .letter-image {
      display: block;
      max-width: 100%;
      max-height: 92vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 16px 50px rgba(0,0,0,.65);
    }

    .close-button {
      position: absolute;
      top: -12px;
      right: -7px;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.3);
      border-radius: 50%;
      background: rgba(15, 15, 15, .9);
      color: white;
      font-size: 25px;
      line-height: 36px;
      cursor: pointer;
      z-index: 5;
    }

    @media (max-width: 480px) {
      .page {
        padding-left: 16px;
        padding-right: 16px;
      }

      .title {
        font-size: 24px;
      }

      .owl-video {
        max-height: 34vh;
      }

      .envelope-button {
        max-width: 350px;
      }

      .modal {
        padding: 9px;
      }

      .letter-image {
        max-height: 95vh;
      }

      .close-button {
        top: 3px;
        right: 3px;
      }
    }
  </style>
</head>

<body>

  <!-- AUDIO -->
  <audio id="backgroundMusic" loop preload="auto">
    <source src="./hedwig-theme.mp3" type="audio/mpeg">
  </audio>

  <main class="page">

    <h1 class="title">Una entrega especial</h1>
    <p class="subtitle">HOGWARTS POST</p>

    <!-- VIDEO HEDWIG -->
    <div class="owl-container">
      <video
        class="owl-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
      >
        <source src="./hedwig.mp4" type="video/mp4">
      </video>
    </div>

    <!-- SOUND -->
    <div class="sound-message">
      Activa el volumen para escuchar la magia
    </div>

    <button
      class="volume-button"
      id="volumeButton"
      type="button"
      aria-label="Activar o desactivar música"
    >
      :loud_sound: Activa el volumen
    </button>

    <!-- ENVELOPE -->
    <button
      class="envelope-button"
      id="openLetter"
      type="button"
      aria-label="Abrir carta"
    >
      <img
        src="./envelope.png"
        alt="Carta de Hogwarts"
      >
    </button>

    <div class="open-text">
      Haz clic en el sobre para abrir la carta que te entregó Hedwig
      <span>Tu viaje está por comenzar...</span>
    </div>

  </main>

  <!-- LETTER MODAL -->
  <div class="modal" id="letterModal">

    <div class="letter-wrapper">

      <button
        class="close-button"
        id="closeLetter"
        type="button"
        aria-label="Cerrar carta"
      >
        ×
      </button>

      <img
        class="letter-image"
        src="./carta-hogwarts.png"
        alt="Carta para Marisela"
      >

    </div>

  </div>

  <script>
    const music = document.getElementById("backgroundMusic");
    const volumeButton = document.getElementById("volumeButton");

    const openLetter = document.getElementById("openLetter");
    const closeLetter = document.getElementById("closeLetter");
    const letterModal = document.getElementById("letterModal");

    let musicEnabled = false;

    music.volume = 0.65;

    /*
      Los navegadores móviles suelen bloquear audio automático
      con sonido. Intentamos reproducirlo al cargar y, si el
      navegador lo bloquea, el botón lo activa con el primer toque.
    */
    window.addEventListener("load", async () => {
      try {
        await music.play();
        musicEnabled = true;
        volumeButton.textContent = ":loud_sound: Música activada";
      } catch (error) {
        musicEnabled = false;
        volumeButton.textContent = ":loud_sound: Activa el volumen";
      }
    });

    async function activateMusic() {
      try {
        music.muted = false;
        await music.play();
        musicEnabled = true;
        volumeButton.textContent = ":loud_sound: Música activada";
      } catch (error) {
        console.log("El navegador requiere interacción para reproducir audio.");
      }
    }

    volumeButton.addEventListener("click", async () => {

      if (!musicEnabled || music.paused) {
        await activateMusic();
      } else {
        music.pause();
        musicEnabled = false;
        volumeButton.textContent = ":mute: Música desactivada";
      }

    });

    openLetter.addEventListener("click", async () => {

      /*
        El toque sobre la carta también puede iniciar la música
        si Safari/Chrome bloqueó el autoplay.
      */
      if (!musicEnabled || music.paused) {
        await activateMusic();
      }

      letterModal.classList.add("show");
      document.body.style.overflow = "hidden";

    });

    function closeModal() {
      letterModal.classList.remove("show");
      document.body.style.overflow = "";
    }

    closeLetter.addEventListener("click", closeModal);

    letterModal.addEventListener("click", (event) => {
      if (event.target === letterModal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeModal();
      }
    });

    /*
      En algunos celulares el primer toque en cualquier parte
      de la página permite desbloquear el audio.
    */
    document.addEventListener(
      "touchstart",
      () => {
        if (!musicEnabled) {
          activateMusic();
        }
      },
      { once: true }
    );

  </script>

</body>
</html>
